<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Exam</title>

    <!-- GOOGLE FONT -->

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- FONT AWESOME ICONS -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #f4f7fc;
        min-height: 100vh;
      }

      /* NAVBAR */

      .navbar {
        /* background: linear-gradient(135deg, #2563eb, #16a34a); */
        background: #2563eb;
        color: white;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      }

      .navbar h1 {
        font-size: 28px;
        font-weight: 600;
      }

      .navbar h1 i {
        margin-right: 10px;
        color: #60a5fa;
      }

      /* PAGE */

      .page-container {
        width: 95%;
        max-width: 900px;
        margin: 40px auto;
      }

      /* CARD */

      .exam-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      .exam-card h2 {
        font-size: 32px;
        color: #111827;
        margin-bottom: 15px;
      }

      .exam-description {
        color: #4b5563;
        font-size: 16px;
        margin-bottom: 25px;
        line-height: 1.8;
      }

      /* INFO BOX */

      .info-box {
        background: #eff6ff;
        border-left: 5px solid #2563eb;
        padding: 22px;
        border-radius: 14px;
        margin-bottom: 30px;
      }

      .info-item {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
        color: #1e3a8a;
        font-size: 15px;
        font-weight: 500;
      }

      .info-item:last-child {
        margin-bottom: 0;
      }

      .info-item i {
        width: 40px;
        height: 40px;
        background: #dbeafe;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2563eb;
        font-size: 18px;
      }

      /* BUTTON */

      .start-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 15px 28px;
        background: #16a34a;
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        transition: 0.3s;
      }

      .start-btn:hover {
        background: #15803d;
        transform: translateY(-2px);
      }

      /* RESPONSIVE */

      @media (max-width: 768px) {
        .navbar {
          padding: 20px;
        }

        .navbar h1 {
          font-size: 22px;
        }

        .exam-card {
          padding: 25px;
        }

        .exam-card h2 {
          font-size: 26px;
        }

        .info-item {
          align-items: flex-start;
        }
      }
      .home-btn {
        text-decoration: none;
        background: white;
        color: #2563eb;
        padding: 10px 18px;
        border-radius: 10px;
        font-weight: 500;
        transition: 0.3s;
      }

      .home-btn:hover {
        background: #dbeafe;
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->

    <div class="navbar">
      <h1>
        <i class="fa-solid fa-graduation-cap"></i>
        Student Examination
      </h1>
      <div class="nav-links">
        <a href="{% url 'home' %}" class="home-btn"> Home </a>
      </div>
    </div>

    <!-- PAGE -->

    <div class="page-container">
      <!-- CARD -->

      <div class="exam-card">
        <h2>{{ exam.title }}</h2>

        <p class="exam-description">{{ exam.description }}</p>

        <!-- INFO -->

        <div class="info-box">
          <div class="info-item">
            <i class="fa-regular fa-clock"></i>

            <span> Duration: {{ exam.duration }} Minutes </span>
          </div>

          <div class="info-item">
            <i class="fa-solid fa-key"></i>

            <span> Test Code: {{ exam.test_code }} </span>
          </div>
        </div>

        <!-- BUTTON -->

        <a href="{% url 'student_details' exam.id %}" class="start-btn">
          <i class="fa-solid fa-play"></i>

          Start Test
        </a>
      </div>
    </div>
  </body>
</html>
