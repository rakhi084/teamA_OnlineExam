<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Details</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .form-container h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .exam-box {
            background: #eff6ff;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 25px;
        }

        .exam-box p {
            margin-bottom: 10px;
            color: #1e3a8a;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .start-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .start-btn:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

    <div class="form-container">

        <h1>Student Verification</h1>

        <p class="subtitle">
            Fill your details to start the exam
        </p>

        <div class="exam-box">

            <p>
                <strong>Exam:</strong>
                {{ exam.title }}
            </p>

            <p>
                <strong>Duration:</strong>
                {{ exam.duration }} Minutes
            </p>

            <p>
                <strong>Test Code:</strong>
                {{ exam.test_code }}
            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">
                <label>Full Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter Full Name"
                    required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter Email Address"
                    required>
            </div>

            <div class="input-group">
                <label>University Name</label>
                <input
                    type="text"
                    name="university_name"
                    placeholder="Enter University Name"
                    required>
            </div>

            <button type="submit" class="start-btn">
                Start Exam
            </button>

        </form>

    </div>

</body>

</html>
